<div class="nuclear-container">
  <!-- Fond avec effets nucléaires -->
  <div class="nuclear-effects">
    <div class="particle" *ngFor="let p of particles" [style]="p.style"></div>
  </div>

  <!-- Contenu principal centré -->
  <div class="main-content">
    <!-- Logo avec nouveau design élégant -->
    <div class="logo-enhanced-container">
      <div class="logo-glow-background"></div>
      <div class="logo-frame"></div>
      <img src="assets/image/logo3.png" 
           alt="Centre National des Sciences et Technologies Nucléaires" 
           class="logo-main">
    </div>

    <!-- Titre institutionnel -->
    <h1 class="institution-title">
      Centre National des Sciences<br>et Technologies Nucléaires
    </h1>
  </div>
</div>
