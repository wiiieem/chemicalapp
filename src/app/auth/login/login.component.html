<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <img src="assets/image/logo3.png" alt="CNSTN" class="login-logo" />
      <h2>🔐 Connexion CNSTN</h2>
      <p>Gestion des Produits Chimiques</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          required
          class="form-input"
        />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          required
          class="form-input"
        />
      </div>

      <div *ngIf="errorMessage" class="error-message">
        ⚠️ {{ errorMessage }}
      </div>

      <button type="submit" class="login-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Se connecter</span>
        <span *ngIf="isLoading">Connexion en cours...</span>
      </button>
    </form>

    <div class="demo-credentials">
      <h4>🔑 Comptes de démonstration :</h4>
      <div class="account-list">
        <div class="account-item admin">
          <strong>Administrateur :</strong>
          <p>Email: admin@cnstn.com</p>
          <p>Mot de passe: admin123</p>
        </div>
        <div class="account-item user">
          <strong>Utilisateur :</strong>
          <p>Email: user@cnstn.com</p>
          <p>Mot de passe: user123</p>
        </div>
      </div>
    </div>
  </div>
</div>
